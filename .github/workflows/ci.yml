# CI/CD — test → build → deploy (chỉ khi push main và test/build xanh)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (skip deploy + bonus self-check)
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py tests/test_cp4.py
          -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:ci .

  deploy:
    name: Deploy
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway (nếu có token)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN chưa cấu hình — bỏ qua deploy thật (lab LOCAL_FALLBACK)."
            exit 0
          fi
          npm i -g @railway/cli
          railway up

      - name: Smoke test
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "PUBLIC_URL chưa set — bỏ qua smoke test."
            exit 0
          fi
          sleep 45
          curl -fsS "${PUBLIC_URL}/health"
